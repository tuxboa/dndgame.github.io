<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark RPG Engine</title>
    <style>
      #debug-menu-container {
        position: fixed;
        top: 10px;
        right: 10px;
        transform: none;
        background: #1a1a2e;
        border: 2px solid #16c784;
        border-radius: 8px;
        padding: 20px;
        z-index: 10000;
        max-height: 90vh;
        max-width: 400px;
        overflow-y: auto;
        color: #00ff00;
        font-family: monospace;
        box-shadow: 0 0 20px rgba(22, 199, 132, 0.5);
      }

      .debug-header {
        font-size: 1.5em;
        font-weight: bold;
        margin-bottom: 15px;
        color: #16c784;
        text-align: center;
      }

      .debug-section {
        margin-bottom: 15px;
        padding-bottom: 15px;
        border-bottom: 1px solid #16c784;
      }

      .debug-section:last-child {
        border-bottom: none;
      }

      .debug-section h4 {
        margin: 0 0 10px 0;
        color: #00ff00;
      }

      #debug-state-view {
        background: #0a0a0e;
        border: 1px solid #16c784;
        padding: 10px;
        border-radius: 4px;
        max-height: 200px;
        overflow-y: auto;
        font-size: 0.8em;
        color: #00ff00;
      }

      #debug-menu-container button {
        background: #16c784;
        color: #000;
        border: none;
        padding: 8px 12px;
        margin: 5px 5px 5px 0;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        font-family: monospace;
      }

      #debug-menu-container button:hover {
        background: #00ff00;
      }

      #debug-menu-container label {
        display: block;
        margin: 8px 0;
        color: #00ff00;
      }

      #debug-menu-container input {
        background: #0a0a0e;
        color: #00ff00;
        border: 1px solid #16c784;
        padding: 5px;
        margin-left: 5px;
        width: 100px;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- Dice Click Overlay (DiceBoxUI) -->
    <div
      id="dice-click-overlay"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 9999;
        display: none;
        justify-content: center;
        align-items: center;
        background: transparent;
        pointer-events: auto;
        flex-direction: column;
      "
    >
      <!-- Dice Display Container (holds both 3D and result) -->
      <div
        style="
          position: relative;
          width: 300px;
          height: 300px;
          display: flex;
          align-items: center;
          justify-content: center;
        "
      >
        <!-- 3D Dice Container -->
        <div
          id="dice-3d-container"
          style="
            width: 100%;
            height: 100%;
            position: absolute;
            pointer-events: auto;
          "
        ></div>

        <!-- Dice Result Display (centered over dice position) -->
        <div
          id="dice-result-display"
          style="
            color: #00ff00;
            font-size: 8rem;
            font-weight: bold;
            font-family: monospace;
            text-align: center;
            position: absolute;
            display: none;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            z-index: 10;
          "
        ></div>
      </div>

      <!-- Instructions (positioned at bottom) -->
      <div
        id="dice-click-instructions"
        style="
          color: white;
          position: absolute;
          bottom: 8%;
          left: 50%;
          transform: translateX(-50%);
          font-family: sans-serif;
          pointer-events: auto;
          font-size: 1.2rem;
        "
      >
        Kattints a dobáshoz!
      </div>
    </div>

    <!-- Debug Menu Container -->
    <div id="debug-menu-container" style="display: none">
      <div class="debug-header">Cyborg DM - Isteni Mód</div>

      <div class="debug-section">
        <h4>🌍 WorldState (Live)</h4>
        <pre id="debug-state-view">Várakozás az adatokra...</pre>
      </div>

      <div class="debug-section">
        <h4>⏳ Time Control</h4>
        <button id="btn-debug-day">☀️ Nappal</button>
        <button id="btn-debug-night">🌙 Éjszaka</button>
      </div>

      <div class="debug-section">
        <h4>⚡ Event Trigger</h4>
        <button id="btn-debug-roll">🎲 Force Skill Check</button>
        <button id="btn-debug-combat">⚔️ Force Combat</button>
        <button id="btn-debug-loot">🎁 Get Gold & XP</button>
        <button id="btn-debug-chronicle">📜 Test Chronicle</button>
      </div>

      <div class="debug-section">
        <h4>🤝 Factions</h4>
        <label
          >Guard:
          <input type="number" id="debug-faction-guard" value="0" /></label
        ><br />
        <label
          >Under: <input type="number" id="debug-faction-underworld" value="0"
        /></label>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
